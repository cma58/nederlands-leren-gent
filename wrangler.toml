name = "nederlands-leren-gent-api"
account_id = "586f6e20a0f9d62a214e636e32f40bc0"
main = "worker/src/index.js"
compatibility_date = "2026-08-01"

[secrets]
required = ["ADMIN_BOOTSTRAP_SECRET", "GROQ_API_KEY"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "nederlands-leren-gent"
# D1-productiedatabase, aangemaakt met EU-jurisdictie.
database_id = "eb55feb7-f597-4e08-a1c3-9ba2d0949d6e"
migrations_dir = "migrations"

[vars]
ADMIN_EMAIL = "amine.chtaiti@gmail.com"
SESSION_DAYS = "14"
PBKDF2_ITERATIONS = "100000"
COOKIE_SECURE = "true"
GROQ_SPEECH_MODEL = "whisper-large-v3-turbo"
SPEECH_MAX_SECONDS = "30"
SPEECH_DAILY_SECONDS_PER_USER = "600"
SPEECH_DAILY_REQUESTS_PER_USER = "100"
# Productie gebruikt automatisch dezelfde Worker-origin. Vul dit alleen in
# wanneer bewust een extra externe frontend toegang nodig heeft.
APP_ORIGIN = ""
