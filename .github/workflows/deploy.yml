name: Controle en Cloudflare-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node opzetten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependencies installeren
        run: npm ci
      - name: Backendtests
        run: npm test
      - name: Productiebuild
        run: npm run build

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node opzetten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependencies installeren
        run: npm ci
      - name: Productiebuild
        run: npm run build
      - name: Bouwen en publiceren
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          preCommands: wrangler d1 migrations apply nederlands-leren-gent --remote
          secrets: |
            ADMIN_BOOTSTRAP_SECRET
            GROQ_API_KEY
          command: deploy
        env:
          ADMIN_BOOTSTRAP_SECRET: ${{ secrets.ADMIN_BOOTSTRAP_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
